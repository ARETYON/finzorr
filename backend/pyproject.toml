[project]
name = "finzorr-backend"
version = "0.1.0"
description = "finzorr.ai backend — general-purpose AI assistant with a finance vertical"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "qdrant-client>=1.12,<1.18",
    "openai>=1.40",
    "httpx>=0.27",
    "yfinance>=0.2.40",
    "rapidfuzz>=3.9",
    "sqlglot>=25.0",
    "google-auth>=2.30",
    "pyjwt>=2.9",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "S", "SIM"]
ignore = ["S101", "B008"]  # S101: asserts in tests; B008: FastAPI Depends() idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "sanity: fast deterministic tests, no live deps (PR gate)",
    "integration: needs live Postgres/Redis/Qdrant",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["alembic/"]
