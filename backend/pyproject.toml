[project]
name = "finzorr-backend"
version = "0.1.0"
description = "finzorr.ai backend — general-purpose AI assistant with a finance vertical"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "qdrant-client>=1.12,<1.18",
    "openai>=1.40",
    "httpx>=0.27",
    "yfinance>=0.2.40",
    "rapidfuzz>=3.9",
    "sqlglot>=25.0",
    "google-auth>=2.30",
    "pyjwt>=2.9",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",  # checkpointer AsyncConnectionPool — explicit, not transitive
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-docx>=1.2.0",
    "cryptography>=50.0.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "S", "SIM"]
ignore = ["S101", "B008"]  # S101: asserts in tests; B008: FastAPI Depends() idiom

[tool.ruff.lint.per-file-ignores]
# tests: asserts (S101) and throwaway credentials (S105/S106) are the point;
# everything else in the S family still applies to test code.
"tests/*" = ["S101", "S105", "S106", "SIM117"]
# autogenerated migration bodies: don't fight alembic's line formatting
"alembic/versions/*" = ["E501", "W291"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "sanity: fast deterministic tests, no live deps (PR gate)",
    "integration: needs live Postgres/Redis/Qdrant",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = ["alembic/"]

# Only these third-party packages ship no stubs — everything else is checked
# for real. A global ignore_missing_imports silently degrades every untyped
# surface to Any; keep this list explicit and shrinking.
[[tool.mypy.overrides]]
module = [
    "google.auth.*",
    "google.oauth2.*",
    "yfinance.*",
    "rapidfuzz.*",
    "fitz.*",
    "docx.*",
    "bs4.*",
    "qdrant_client.*",
    "langgraph.*",
    "structlog.*",
    "jwt.*",
    "cryptography.*",
    "psycopg.*",
    "psycopg_pool.*",
]
ignore_missing_imports = true
