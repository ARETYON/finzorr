# Local dev dependencies only — the API and frontend run natively.
# Host ports are offset (+1/+2) to avoid colliding with other local stacks
# (e.g. local-agent-platform already uses 6333/6379).
# Embeddings use the host's native Ollama (http://localhost:11434) in dev.

services:
  postgres:
    image: pgvector/pgvector:pg16  # pgvector required by the LangGraph store's semantic index
    container_name: finzorr-postgres
    environment:
      POSTGRES_USER: finzorr
      POSTGRES_PASSWORD: finzorr
      POSTGRES_DB: finzorr
    ports:
      - "5433:5432"
    volumes:
      - finzorr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finzorr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: finzorr-redis
    command: ["redis-server", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"

  qdrant:
    # ACTION REQUIRED for existing dev setups: Qdrant now requires an API
    # key and its port is loopback-only. Set QDRANT_API_KEY in your local
    # .env to any value (must match this compose file) before restarting —
    # the app's own get_client() sends QDRANT_API_KEY and will 401 against
    # an unauthenticated Qdrant otherwise. Was previously unauthenticated
    # with a network-exposed port (0.0.0.0:6335) — this closes that gap.
    image: qdrant/qdrant:latest
    container_name: finzorr-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in your .env}
    ports:
      - "127.0.0.1:6335:6333"
    volumes:
      - finzorr_qdrant:/qdrant/storage

volumes:
  finzorr_pgdata:
  finzorr_qdrant:
