name: ci-backend

on:
  push:
    branches: [main, staging]
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finzorr
          POSTGRES_PASSWORD: finzorr
          POSTGRES_DB: finzorr_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U finzorr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check app/ tests/ alembic/
      - name: Typecheck (mypy --strict)
        run: uv run mypy app/ tests/
      - name: Env-var parity (.env.example covers every Settings field)
        run: |
          uv run python - <<'EOF'
          from app.core.config import Settings
          example = open(".env.example").read()
          missing = [f for f in Settings.model_fields if f"{f}=" not in example]
          assert not missing, f".env.example is missing: {missing}"
          print(f"parity OK ({len(Settings.model_fields)} vars)")
          EOF
      - name: Sanity tests (no live deps)
        run: uv run pytest tests/ -q -m sanity --cov=app --cov-report=
      - name: Migrations run clean on a fresh database
        env:
          DATABASE_URL: postgresql+psycopg://finzorr:finzorr@localhost:5433/finzorr_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Integration tests (router + ownership, live Postgres)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://finzorr:finzorr@localhost:5433/finzorr_test
        run: uv run pytest tests/ -q -m integration --cov=app --cov-append --cov-fail-under=50
